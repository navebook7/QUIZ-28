    <script>
      // Make window.fetch safely writable to avoid "Cannot set property fetch of #<Window> which has only a getter"
      try {
        let _fetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(fn) {
            _fetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Continue normally if already defined/unsupported
      }
    </script>
